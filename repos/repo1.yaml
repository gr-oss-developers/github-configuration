description: Description changed for demo purposes
visibility: public
default_branch: main
has_issues: true
has_projects: true
topics:
  - example
  - github
  - terraform
rulesets:
  - enforcement: active
    name: test
    rules:
      deletion: true
      non_fast_forward: true
      required_status_checks:
        required_check:
          - context: all-required-checks-complete
            source: GitHub Actions
        strict_required_status_checks_policy: true
    target: branch
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
  - name: OSPO default branch
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
    rules:
      deletion: true
      non_fast_forward: true
      pull_request:
        required_approving_review_count: 1
vulnerability_alerts_enabled: true
branch_protections_v4:
  - pattern: gh-pages
    allows_deletions: false
    allows_force_pushes: false
    blocks_creations: true
    enforce_admins: true
    require_conversation_resolution: false
    require_signed_commits: false
    required_linear_history: false
    restricts_pushes: true
    lock_branch: false
