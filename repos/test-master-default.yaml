description: Phase 3 test - repository created with a non-main default branch
visibility: public
default_branch: master
has_issues: true
vulnerability_alerts_enabled: true
environments:
  - environment: production
    wait_timer: 5
    can_admins_bypass: false
    prevent_self_review: true
    reviewers:
      users:
        - dev-milos
    deployment_policy:
      policy_type: selected_branches_and_tags
      branch_patterns:
        - master
        - release/*
      tag_patterns:
        - v*
  - environment: staging
    can_admins_bypass: true
    deployment_policy:
      policy_type: protected_branches
