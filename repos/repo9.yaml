description: Repository 9 created with Terraform tada
visibility: public
default_branch: master
has_projects: true
rulesets:
  - enforcement: active
    name: Test
    rules:
      deletion: true
      non_fast_forward: true
    target: branch
    bypass_actors:
      - name: write-role
        bypass_mode: pull_request
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
vulnerability_alerts_enabled: true
