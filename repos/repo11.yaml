description: Will it drift?
visibility: public
default_branch: master
has_issues: true
has_projects: true
rulesets:
  - enforcement: active
    name: A test
    rules:
      deletion: true
      non_fast_forward: true
    target: branch
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
  - name: OSPO default branch
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
    rules:
      deletion: true
      non_fast_forward: true
      pull_request:
        required_approving_review_count: 1
vulnerability_alerts_enabled: true
