description: Simple Spring Boot demo with SBOM generation
visibility: public
default_branch: main
has_issues: true
has_projects: true
has_wiki: true
allow_rebase_merge: true
delete_branch_on_merge: false
vulnerability_alerts_enabled: true
custom_properties:
  oss_lifecycle: contributing
rulesets:
  - name: OSPO default branch
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
    rules:
      deletion: true
      non_fast_forward: true
      pull_request:
        required_approving_review_count: 1
