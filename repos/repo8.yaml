description: Repository 8 created with Terraform
visibility: public
default_branch: main
has_issues: true
has_projects: true
pages:
  build_type: workflow
vulnerability_alerts_enabled: true
environments:
  - environment: github-pages
    can_admins_bypass: true
    deployment_policy:
      policy_type: selected_branches_and_tags
      branch_patterns:
        - main
