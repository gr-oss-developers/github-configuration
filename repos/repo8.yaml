description: Repository 8 created with Terraform
visibility: public
default_branch: main
has_issues: true
has_projects: true
pages:
  build_type: workflow
vulnerability_alerts_enabled: true
environments:
  - environment: github-pages
    can_admins_bypass: true
    deployment_policy:
      policy_type: selected_branches_and_tags
      branch_patterns:
        - main
rulesets:
  - name: OSPO default branch
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
    rules:
      deletion: true
      non_fast_forward: true
      pull_request:
        required_approving_review_count: 1
