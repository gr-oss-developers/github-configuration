name: Import single repository

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'The name of the repository to import'
        required: true

jobs:
  import-repo:
    uses: G-Research/github-terraformer/.github/workflows/import.yaml@f9a66f117507a28fd166edd1cddc10539d154220 # v0.3.0
    with:
      repo_name: ${{ github.event.inputs.repo_name }}
      gcss_ref: f9a66f117507a28fd166edd1cddc10539d154220 # v0.3.0
    secrets:
        app_private_key: ${{ secrets.APP_PRIVATE_KEY }}