name: Import single repository

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'The name of the repository to import'
        required: true

jobs:
  import-repo:
    uses: G-Research/github-terraformer/.github/workflows/import.yaml@229a5c89f91a8ff8dc1d6805de1021a4a8e0ccee # v0.5.0
    with:
      repo_name: ${{ github.event.inputs.repo_name }}
      gcss_ref: 229a5c89f91a8ff8dc1d6805de1021a4a8e0ccee # v0.5.0
    secrets:
        app_private_key: ${{ secrets.APP_PRIVATE_KEY }}