name: Import single repository

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'The name of the repository to import'
        required: true

jobs:
  import-repo:
    uses: G-Research/github-terraformer/.github/workflows/import.yaml@c6c4fedc73fc486196e61ed4beda54ae084ab359 # test: reduce-yaml-verbosity (#93)
    with:
      repo_name: ${{ github.event.inputs.repo_name }}
      gcss_ref: c6c4fedc73fc486196e61ed4beda54ae084ab359 # test: reduce-yaml-verbosity (#93)
    secrets:
        app_private_key: ${{ secrets.APP_PRIVATE_KEY }}