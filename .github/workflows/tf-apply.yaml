name: Terraform apply

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'importer_tmp_dir/**'

jobs:
  terraform-apply:
    uses: G-Research/github-terraformer/.github/workflows/tf-apply.yaml@da91e8f29c67158632b842121f80dd12e4cd6665 # test: reduce-yaml-verbosity (#93)
    with:
      commit_sha: ${{ github.sha }}
      gcss_ref: da91e8f29c67158632b842121f80dd12e4cd6665 # test: reduce-yaml-verbosity (#93)
      tfc_org: "GR-OSS"
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      tfc_token: ${{ secrets.TFC_TOKEN }}