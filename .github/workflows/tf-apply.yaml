name: Terraform apply

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'importer_tmp_dir/**'

jobs:
  terraform-apply:
    uses: G-Research/github-terraformer/.github/workflows/tf-apply.yaml@229a5c89f91a8ff8dc1d6805de1021a4a8e0ccee # v0.5.0
    with:
      commit_sha: ${{ github.sha }}
      gcss_ref: 229a5c89f91a8ff8dc1d6805de1021a4a8e0ccee # v0.5.0
      tfc_org: "GR-OSS"
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      tfc_token: ${{ secrets.TFC_TOKEN }}