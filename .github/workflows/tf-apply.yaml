name: Terraform apply

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'importer_tmp_dir/**'

jobs:
  terraform-apply:
    uses: G-Research/github-terraformer/.github/workflows/tf-apply.yaml@fee46dcfb5df6d393b21f493a631812c8e69934e # v0.3.1
    with:
      commit_sha: ${{ github.sha }}
      gcss_ref: fee46dcfb5df6d393b21f493a631812c8e69934e # v0.3.1
      tfc_org: "GR-OSS"
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      tfc_token: ${{ secrets.TFC_TOKEN }}