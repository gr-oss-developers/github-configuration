name: Decommission repository

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to decommission (matches repos/<repo>.yaml)'
        required: true

jobs:
  decommission:
    uses: G-Research/github-terraformer/.github/workflows/decommission.yaml@f9a66f117507a28fd166edd1cddc10539d154220 # v0.3.0
    with:
      repo: ${{ github.event.inputs.repo }}
      gcss_ref: f9a66f117507a28fd166edd1cddc10539d154220 # v0.3.0
      tfc_org: "GR-OSS"
    secrets:
      tfc_token: ${{ secrets.TFC_TOKEN }}
