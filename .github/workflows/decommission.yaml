name: Decommission repository

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to decommission (matches repos/<repo>.yaml)'
        required: true

jobs:
  decommission:
    uses: G-Research/github-terraformer/.github/workflows/decommission.yaml@fee46dcfb5df6d393b21f493a631812c8e69934e # v0.3.1
    with:
      repo: ${{ github.event.inputs.repo }}
      gcss_ref: fee46dcfb5df6d393b21f493a631812c8e69934e # v0.3.1
      tfc_org: "GR-OSS"
    secrets:
      tfc_token: ${{ secrets.TFC_TOKEN }}
