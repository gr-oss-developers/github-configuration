name: Decommission repository

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to decommission (matches repos/<repo>.yaml)'
        required: true

jobs:
  decommission:
    uses: G-Research/github-terraformer/.github/workflows/decommission.yaml@7cabb59c07b729265e46e492514d5e19e85d75d7 # v0.4.0
    with:
      repo: ${{ github.event.inputs.repo }}
      gcss_ref: 7cabb59c07b729265e46e492514d5e19e85d75d7 # v0.4.0
      tfc_org: "GR-OSS"
    secrets:
      tfc_token: ${{ secrets.TFC_TOKEN }}
