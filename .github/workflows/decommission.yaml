name: Decommission repository

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to decommission (matches repos/<repo>.yaml)'
        required: true

jobs:
  decommission:
    uses: G-Research/github-terraformer/.github/workflows/decommission.yaml@da91e8f29c67158632b842121f80dd12e4cd6665 # test: reduce-yaml-verbosity (#93)
    with:
      repo: ${{ github.event.inputs.repo }}
      gcss_ref: da91e8f29c67158632b842121f80dd12e4cd6665 # test: reduce-yaml-verbosity (#93)
      tfc_org: "GR-OSS"
    secrets:
      tfc_token: ${{ secrets.TFC_TOKEN }}
