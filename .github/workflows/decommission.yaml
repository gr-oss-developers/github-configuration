name: Decommission repository

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to decommission (matches repos/<repo>.yaml)'
        required: true

jobs:
  decommission:
    uses: G-Research/github-terraformer/.github/workflows/decommission.yaml@229a5c89f91a8ff8dc1d6805de1021a4a8e0ccee # v0.5.0
    with:
      repo: ${{ github.event.inputs.repo }}
      gcss_ref: 229a5c89f91a8ff8dc1d6805de1021a4a8e0ccee # v0.5.0
      tfc_org: "GR-OSS"
    secrets:
      tfc_token: ${{ secrets.TFC_TOKEN }}
