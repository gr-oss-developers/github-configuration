name: Decommission repository

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to decommission (matches repos/<repo>.yaml)'
        required: true

jobs:
  decommission:
    uses: G-Research/github-terraformer/.github/workflows/decommission.yaml@c6c4fedc73fc486196e61ed4beda54ae084ab359 # test: reduce-yaml-verbosity (#93)
    with:
      repo: ${{ github.event.inputs.repo }}
      gcss_ref: c6c4fedc73fc486196e61ed4beda54ae084ab359 # test: reduce-yaml-verbosity (#93)
      tfc_org: "GR-OSS"
    secrets:
      tfc_token: ${{ secrets.TFC_TOKEN }}
