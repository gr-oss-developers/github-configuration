name: Terraform Plan

on:
  workflow_run:
    workflows: [ "Bootstrap" ]
    types:
      - requested

jobs:
  terraform-plan:
    uses: G-Research/github-terraformer/.github/workflows/tf-plan.yaml@c6c4fedc73fc486196e61ed4beda54ae084ab359 # test: reduce-yaml-verbosity (#93)
    with:
      commit_sha: ${{ github.event.workflow_run.head_sha }}
      gcss_ref: c6c4fedc73fc486196e61ed4beda54ae084ab359 # test: reduce-yaml-verbosity (#93)
      tfc_org: "GR-OSS"
    secrets:
      app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      tfc_token: ${{ secrets.TFC_TOKEN }}