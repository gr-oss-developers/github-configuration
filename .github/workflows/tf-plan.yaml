name: Terraform Plan

on:
  workflow_run:
    workflows: [ "Bootstrap" ]
    types:
      - requested

jobs:
  terraform-plan:
    uses: G-Research/github-terraformer/.github/workflows/tf-plan.yaml@7cabb59c07b729265e46e492514d5e19e85d75d7 # v0.4.0
    with:
      commit_sha: ${{ github.event.workflow_run.head_sha }}
      gcss_ref: 7cabb59c07b729265e46e492514d5e19e85d75d7 # v0.4.0
      tfc_org: "GR-OSS"
    secrets:
      app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      tfc_token: ${{ secrets.TFC_TOKEN }}