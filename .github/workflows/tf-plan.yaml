name: Terraform Plan

on:
  workflow_run:
    workflows: [ "Bootstrap" ]
    types:
      - requested

jobs:
  terraform-plan:
    uses: G-Research/github-terraformer/.github/workflows/tf-plan.yaml@f9a66f117507a28fd166edd1cddc10539d154220 # v0.3.0
    with:
      commit_sha: ${{ github.event.workflow_run.head_sha }}
      gcss_ref: f9a66f117507a28fd166edd1cddc10539d154220 # v0.3.0
      tfc_org: "GR-OSS"
    secrets:
      app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      tfc_token: ${{ secrets.TFC_TOKEN }}